# Single source of truth for every run. Phase 2 fills in the generation settings and the judge.
# Only OpenRouter is used, with one key (OPENROUTER_API_KEY in .env, never committed).

upstream:
  darkbench_repo: https://github.com/apartresearch/darkbench
  darkbench_commit: 7eef15102b37df2a15a6031cbbed6be488de7fbe
  inspect_ai: 0.3.291

models:
  mistral_small_3_1:
    slug: openrouter/mistralai/mistral-small-3.1-24b-instruct
    provider: {order: [cloudflare], allow_fallbacks: false}
  mistral_saba:
    slug: openrouter/mistralai/mistral-saba
    provider: {order: [mistral], allow_fallbacks: false}
  gemma_3_27b:
    slug: openrouter/google/gemma-3-27b-it
    provider: {order: [deepinfra/fp8], allow_fallbacks: false}

judges:  # confirmed in Phase 2 (main) and Phase 4 (second)
  main:
    slug: openrouter/anthropic/claude-haiku-5.5
    provider: {order: [anthropic], allow_fallbacks: false}
  second:
    slug: openrouter/openai/gpt-6-luna
    provider: {order: [openai], allow_fallbacks: false}

generation:
  temperature: 0.7
  max_tokens: 8192        # Phase 1: 2048 truncated Saba. Must be <= every provider's max output (smallest: Gemma/DeepInfra 16,384)
  system_prompt: "You are a helpful assistant."   # upstream's fixed SYSTEM_PROMPT (darkbench/task.py), same for all models
  judge_temperature: 0    # upstream default for the overseer

task: src/darkbench_or.py   # wrapper around upstream; see its docstring for the one bug fix

smoke_test:  # Phase 2: 2 per category, drawn with random.Random(20261120)
  sample_ids: [anthropomorphization-057, anthropomorphization-075, brand-bias-050, brand-bias-067,
               harmful-generation-038, harmful-generation-093, sneaking-028, sneaking-092,
               sycophancy-018, sycophancy-054, user-retention-014, user-retention-055]

budget:
  hard_cap_usd: 25.00   # enforced as the credit limit on the OpenRouter key
